<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC Vertex Serviços</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e1238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BC Vertex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="BC Vertex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3fb;--card:#fff;--ink:#1d1630;--muted:#6f6787;--line:#e6e1f2;
  --p:#6d28d9;--p2:#8b5cf6;--p3:#ede7fd;--ok:#059669;--okb:#d1fae5;--warn:#b45309;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--info:#2563eb;--infob:#dbeafe;
  --side:#1e1238;--shadow:0 1px 2px rgba(30,18,56,.06),0 4px 16px rgba(30,18,56,.06);
  --soft:#faf9fe;--hover:#fbfaff;--soft2:#f1f0f5;--lbl:#463d5e;--pp:#6d28d9;--ppt:#f2eefc;--toast:#1e1238;
  --stx:#e9e3ff;--stx2:#cfc4f3;--smut:#b6a6e8;--shov:rgba(255,255,255,.06);--stxh:#fff;--sideb:0;
  --navon:linear-gradient(90deg,var(--p),var(--p2));--navontx:#fff;--navsh:0 6px 18px rgba(109,40,217,.35);
  --glow:rgba(109,40,217,.32);--ring:rgba(139,92,246,.18);--c1:#c4b5fd;--c3:#5b21b6;
  --r:14px;--rb:10px;--rm:16px;--rs:8px;--font:Inter;--zoom:1;
}
html{color-scheme:light}html.dk{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font),system-ui,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:232px;background:var(--side);color:var(--stx);border-right:var(--sideb);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand b{font-size:17px;letter-spacing:.2px;display:block}
.brand small{color:var(--smut);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--rb);color:var(--stx2);font-weight:500}
.nav button:hover{background:var(--shov);color:var(--stxh)}
.nav button.on{background:var(--navon);color:var(--navontx);box-shadow:var(--navsh)}
.nav svg{width:19px;height:19px;flex-shrink:0}
.side .foot{margin-top:auto;font-size:12px;color:var(--smut);padding:8px}
/* Main */
main{flex:1;min-width:0;padding:26px 28px 90px;zoom:var(--zoom)}
.modal,.alerta{zoom:var(--zoom)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;font-weight:800}
.top p{margin:3px 0 0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:var(--rb);padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--p3);color:var(--p)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 14px var(--glow)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--badb);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:var(--rs)}
.btn svg{width:17px;height:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi span{color:var(--muted);font-size:13px;font-weight:500}
.kpi b{display:block;font-size:24px;margin-top:6px;font-weight:800}
.kpi.hl{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.kpi.hl span{color:rgba(255,255,255,.82)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card h3{margin:0;padding:16px 18px 10px;font-size:15px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:var(--rb);background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:var(--muted)}
select.f,input.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rb);background:var(--card);outline:none}
.f:focus,.search input:focus{border-color:var(--p2);box-shadow:0 0 0 3px var(--ring);outline:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.tw{overflow-x:auto}
.r{text-align:right}.c{text-align:center}
.mut{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-orc{background:var(--infob);color:var(--info)}
.t-emi{background:var(--p3);color:var(--p)}
.t-ent{background:var(--okb);color:var(--ok)}
.t-can{background:var(--badb);color:var(--bad)}
.t-low{background:var(--warnb);color:var(--warn)}
.t-zero{background:var(--badb);color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;color:var(--p2);opacity:.45;margin-bottom:8px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,10,40,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;backdrop-filter:blur(2px)}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:var(--rm);width:100%;max-width:560px;box-shadow:0 20px 60px rgba(20,10,40,.3);animation:pop .18s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--rs);color:var(--muted)}
.x:hover{background:var(--bg)}
.mb{padding:18px 20px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--lbl)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s1{grid-column:span 1}
.sec{grid-column:span 6;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--p);font-weight:700;margin-top:6px;border-top:1px dashed var(--line);padding-top:12px}
.sec:first-child{border:0;padding-top:0;margin-top:0}
.items td{padding:8px 10px}
.items input{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--rs);text-align:right}
.tot{display:flex;flex-direction:column;gap:8px;margin-left:auto;max-width:320px;width:100%}
.tot div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot input{width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--rs);text-align:right}
.tot .big{font-size:20px;font-weight:800;color:var(--p);border-top:1px solid var(--line);padding-top:10px}
.addrow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.addrow select{flex:1;min-width:200px}
.addrow input{width:90px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--toast);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:99;font-weight:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.list-mini div{display:flex;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);gap:10px}
.cli-name{font-weight:600}
.t-sig{background:var(--okb);color:var(--ok)}
.t-nsig{background:var(--soft2);color:var(--muted)}
.sigbox{border:2px dashed var(--p2);border-radius:12px;background:#fff;touch-action:none;width:100%;height:220px;display:block;cursor:crosshair}
.done{text-align:center;padding:26px 20px 8px}
.done .ok{width:60px;height:60px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.done .ok svg{width:30px;height:30px}
.done h2{margin:0 0 4px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 20px}
.bigbtns .btn{justify-content:center;padding:16px;flex-direction:column;gap:6px;font-size:14px}
.bigbtns .btn svg{width:24px;height:24px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--p)}
/* Agenda */
.seg{display:inline-flex;background:var(--p3);border-radius:var(--rb);padding:3px}
.seg button,.seg label span{all:unset;cursor:pointer;padding:7px 14px;border-radius:var(--rs);font-weight:600;color:var(--p);font-size:14px}
.seg button.on,.seg input:checked+span{background:var(--card);box-shadow:var(--shadow)}
.seg.big{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.big label{display:block}.seg.big span{display:block;text-align:center;padding:11px}
.seg input{display:none}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.wd{padding:12px 14px}
.wd.today{border-color:var(--p2);box-shadow:0 0 0 2px var(--ring)}
.wdh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ag{border:1px solid var(--line);border-left:4px solid var(--p);border-radius:var(--rb);padding:10px 12px;margin-top:8px;background:var(--card)}
.ag.orcamento{border-left-color:var(--info)}
.ag.done{opacity:.6}
.agh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.agt{font-size:16px;margin-right:2px}
a.btn{text-decoration:none}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.mhd{padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;background:var(--soft);border-bottom:1px solid var(--line)}
.mc{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;cursor:pointer;overflow:hidden}
.mc:nth-child(7n){border-right:0}
.mc:hover{background:var(--hover)}.mc.out{background:var(--soft);color:var(--muted);opacity:.6}
.mc.sel{background:var(--p3)}
.mn{font-size:13px;font-weight:600;margin-bottom:3px}
.mc.today .mn{background:var(--p);color:#fff;border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
.chip{font-size:11px;padding:2px 5px;border-radius:5px;margin-top:2px;background:var(--p3);color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.orcamento{background:var(--infob);color:var(--info)}.chip.done{opacity:.5;text-decoration:line-through}
@media(max-width:860px){.mc{min-height:62px;padding:3px}.chip{font-size:10px;padding:1px 3px}}
/* Lembretes */
.bigbtns .btn small{font-weight:500;opacity:.8;font-size:11px}
.btn[disabled]{opacity:.5;cursor:default}
.alerta{position:fixed;top:16px;left:50%;transform:translate(-50%,-140%);width:min(440px,calc(100% - 32px));background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;z-index:120;box-shadow:0 12px 40px var(--glow);transition:.35s}
.alerta:not(.show){transform:translate(-50%,calc(-100% - 40px));visibility:hidden}
.alerta.show{transform:translate(-50%,0)}
.alerta .ai{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex-shrink:0;animation:ring 1s ease 3}
.alerta .ai svg{width:20px;height:20px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(18deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
/* Documento PDF */
.docprev{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--rb);background:var(--soft)}
.docprev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpi{width:46px;height:56px;border-radius:6px;background:var(--p);color:#fff;display:grid;place-items:center;flex-shrink:0;position:relative}
.dpi svg{width:24px}.dpi:after{content:'PDF';position:absolute;bottom:4px;font-size:9px;font-weight:800;letter-spacing:.5px}
.bigbtns .btn.ghost{flex-direction:row;padding:12px}
.sw.sm{gap:8px;align-items:center}
.sw.sm .swc{width:28px;height:28px}
.sw .same{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink)}
.sw .same i{width:18px;height:18px;border-radius:50%;display:block}
.sw .same.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sigprev{width:150px;height:70px}
.sigpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 4px}
.sigpair>div{background:#fff;border:1px solid var(--line);border-radius:var(--rb);padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:110px}
.sigpair img{max-height:56px;max-width:100%}
.sigpair em{color:#999;font-size:12px;margin:auto}
.sigpair span{border-top:1px solid #333;width:100%;margin-top:6px;padding-top:4px;font-size:12px;font-weight:600;color:#222}
.sigpair small{display:block;font-weight:400;color:#777}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:var(--rs);font-weight:600;color:var(--p);font-size:14px}
.tabs button.on{background:var(--card);box-shadow:var(--shadow)}
.paybox{border:1px solid var(--line);border-radius:var(--rb);padding:14px;background:var(--soft)}
.payrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.payrow span{display:block;font-size:12px}.payrow b{font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.okmsg{margin-top:14px;padding:12px 14px;border-radius:var(--rb);background:var(--okb);color:var(--ok);font-weight:700;display:flex;gap:8px;align-items:center}.okmsg svg{width:18px}
.pgline{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pgthumb{width:46px;height:46px;border-radius:var(--rs);background:var(--soft2) center/cover;flex-shrink:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:11px;font-weight:800}
.pgthumb svg{width:18px;opacity:.5}
.fotobar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:var(--rb);overflow:hidden;background:var(--card)}
.fimg{aspect-ratio:4/3;background:var(--soft2) center/cover;cursor:zoom-in;position:relative}
.fase{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;background:#059669}
.fase.antes{background:#55555f}.fase.durante{background:#d97706}
.fg label.btn{flex-direction:row;gap:6px;font-size:13px;font-weight:600;color:var(--p)}.fg label.btn.ghost{color:var(--ink)}
.fcb{padding:8px}.fcb .f{padding:7px 9px;font-size:13px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}.lightbox .x{position:absolute;top:14px;right:14px}
@media(max-width:860px){.fgrid{grid-template-columns:1fr 1fr}.payrow b{font-size:15px}}
td .acts{flex-wrap:nowrap}
.ncards{display:none}
@media(max-width:860px){.ncards{display:block}.ncard{padding:12px 14px;border-top:1px solid var(--line)}.ncard:first-child{border-top:0}
.nct{display:flex;justify-content:space-between;gap:10px;cursor:pointer}.ncv{font-size:16px;white-space:nowrap}.nctags{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}}
.aviso{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:12px}
.avi{width:38px;height:38px;border-radius:50%;background:var(--p3);color:var(--p);display:grid;place-items:center;flex-shrink:0}.avi svg{width:18px}
.passos{margin:0;padding-left:20px;line-height:1.6}.passos li{margin-bottom:6px}
/* Mobile */
.bnav{display:none}
@media(max-width:860px){
  .side{display:none}
  main{padding:18px 16px 96px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .fg{grid-template-columns:repeat(2,1fr)}
  .s3,.s4,.s6,.sec{grid-column:span 2}.s1{grid-column:span 1}.s2{grid-column:span 2}
  .toast{bottom:92px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--side);border-top:var(--sideb);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .bnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--smut);padding:4px 3px;border-radius:var(--rs);min-width:44px}
  .bnav button.on{color:var(--navontx);background:var(--navon)}
  .bnav svg{width:21px;height:21px}
  .mobhead{display:flex!important}
  .hide-m{display:none}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none}
}
.mobhead{display:none;align-items:center;gap:10px;margin-bottom:14px}
.mobhead b{font-size:16px}
/* Aparência */
.opt{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:4px}
.ol{font-weight:600;font-size:14px}
.seg.wrap{flex-wrap:wrap;gap:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swc{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);position:relative;transition:transform .15s}
.swc:hover{transform:scale(1.1)}
.swc.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.swc.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.blogo{max-height:40px;max-width:120px;border-radius:6px;display:block;object-fit:contain}
.mobhead .blogo{max-height:30px}
.logo-up{display:flex;gap:14px;align-items:flex-start}
.lbox{width:110px;height:76px;border:2px dashed var(--line);border-radius:var(--rb);display:grid;place-items:center;flex-shrink:0;background:#fff;color:#999;overflow:hidden}
.lbox img{max-width:100%;max-height:100%;object-fit:contain}
.lbox svg{width:26px}
.prevnota{background:#fff;color:#111;border-radius:var(--rs);padding:14px 16px;border:1px solid var(--line);font-size:12px}
.phl{display:flex;gap:14px;align-items:center}
.phl img{max-height:64px;max-width:180px;object-fit:contain}
@media(max-width:860px){.opt{grid-template-columns:1fr;gap:8px}}
.grid2>*,.logo-up>div{min-width:0}
.fg label.chk{flex-direction:row;font-size:14px;font-weight:500;color:var(--ink)}
.brand.hl{flex-direction:column;align-items:flex-start;gap:8px}
.side .blogo,.mobhead .blogo{background:#fff;padding:5px 8px;border-radius:var(--rs);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.side .blogo{max-height:56px;max-width:190px}
.prevnota .ph{flex-wrap:wrap}
/* Print */
#print{display:none}
@media print{
  :root{--card:#fff;--ink:#000;--line:#ddd;--bg:#fff}
  main,.modal{zoom:1}
  body{background:#fff;color:#000}
  .app,.ov,.toast,.bnav,.alerta{display:none!important}
  #print{display:block;padding:10px;font-size:13px;color:#000}
  #print table th{background:var(--ppt);color:#333}
  #print td,#print th{padding:7px 8px;border-bottom:1px solid #ddd}
}
.ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--pp);padding-bottom:12px;margin-bottom:14px;gap:20px}
.ph h1{margin:0;font-size:20px;color:var(--pp)}
.pbox{border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.pbox b{color:var(--pp);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.canhoto{border:1px solid #999;border-radius:6px;display:grid;grid-template-columns:1fr 150px;font-size:11px}
.canhoto>div{padding:8px 10px}
.canhoto .cn{border-left:1px solid #999;text-align:center;display:flex;flex-direction:column;justify-content:center}
.canhoto .cn b{font-size:15px;color:var(--pp)}
.canhoto .lin{display:grid;grid-template-columns:140px 1fr;gap:10px;margin-top:8px;align-items:end}
.canhoto .lin span{text-align:center}
.canhoto .v{min-height:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:2px}
.canhoto .l{border-top:1px solid #000;padding-top:3px}
.canhoto .sigimg{height:50px;margin:0}
.corte{border-top:1px dashed #888;margin:12px 0 16px;position:relative;text-align:center;font-size:10px;color:#888}
.corte span{background:#fff;padding:0 8px;position:relative;top:-8px}
.sigimg{height:70px;display:block;margin:0 auto -6px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span id="logoA"></span><div><b id="bNome">BC Vertex</b><small id="bSub">Serviços</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">BC Vertex · (13) 97422-3339</div>
  </aside>
  <main>
    <div class="mobhead"><span id="logoB"></span><b id="mNome">BC Vertex Serviços</b></div>
    <div id="view"></div>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="alerta" id="alerta"></div>
<div id="print"></div>

<script>
/* ===== Ícones ===== */
const I={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 cart:'<path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6L5 3H2"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 010 8M22 21c0-3-2-6-5-7"/>',
 box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
 print:'<path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>',
 move:'<path d="M7 17L17 7M7 7h10v10"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
 up:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
 pen:'<path d="M3 21c3 0 4-3 6-3s2 2 4 2 3-2 5-2"/><path d="M14.5 4.5l3 3L9 16H6v-3z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/>',
 layers:'<path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/>',
 file:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 cam:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
 clip:'<path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
 bell:'<path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 pin:'<path d="M12 22s7-7 7-12a7 7 0 00-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 tool:'<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic=(n,s='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${s}>${I[n]}</svg>`;
const cube=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p2)"/><stop offset="1" style="stop-color:var(--pp)"/></linearGradient></defs><path d="M20 3l15 8.5-15 8.5-15-8.5z" style="fill:var(--c1)"/><path d="M5 11.5L20 20v17L5 28.5z" fill="url(#g1)"/><path d="M35 11.5L20 20v17l15-8.5z" style="fill:var(--c3)"/></svg>`;

/* ===== Dados ===== */
const KEY='bcvertex_pedidos_v1';
const blank={seq:{ped:1,cli:1,prod:1},empresa:{nome:'',doc:'',tel:'',email:'',end:''},clientes:[],servicos:[],produtos:[],pedidos:[],movs:[],agenda:[],cfg:{av1:60,av2:1440,dur:60}};
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(blank)}catch(e){db=structuredClone(blank)}
for(const k in blank) if(db[k]===undefined) db[k]=structuredClone(blank[k]);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Não foi possível salvar no navegador — faça um backup.')}}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return v;v=String(v||'').trim();if(!v)return 0;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const qf=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const dt=d=>new Date(d).toLocaleDateString('pt-BR');
const dth=d=>new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const pad=n=>String(n).padStart(5,'0');
const byId=(arr,id)=>arr.find(x=>x.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
const STAT={orcamento:['Orçamento','t-orc'],emitido:['Emitido','t-emi'],entregue:['Entregue','t-ent'],cancelado:['Cancelado','t-can']};
const tag=s=>`<span class="tag ${STAT[s][1]}">${STAT[s][0]}</span>`;
const PAG=['Dinheiro','Pix','Cartão de crédito','Cartão de débito','Boleto','A prazo'];
function stockTag(p){if(p.estoque<=0)return'<span class="tag t-zero">Sem estoque</span>';if(p.min>0&&p.estoque<=p.min)return'<span class="tag t-low">Baixo</span>';return''}

/* ===== Navegação ===== */
const PAGES=[['painel','Painel','home'],['agenda','Agenda','cal'],['pedidos','Notas','file'],['clientes','Clientes','users'],['servicos','Serviços','tool'],['estoque','Estoque','layers'],['config','Ajustes','cog']];
let soAlerta=false;
const sigTag=p=>p.status==='cancelado'||p.status==='orcamento'?'':(p.assin?'<span class="tag t-sig">✓ Assinada</span>':'<span class="tag t-nsig">Aguardando assinatura</span>');
let page='painel';const q={pedidos:'',clientes:'',produtos:'',servicos:''};let fStatus='';
function nav(){
  $('#nav').innerHTML=PAGES.map(([k,l,i])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('');
  $('#bnav').innerHTML=PAGES.map(([k,l,i])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('');
}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){nav();({painel:vPainel,agenda:vAgenda,pedidos:vPedidos,clientes:vClientes,servicos:vServicos,estoque:vEstoque,config:vConfig})[page]()}
const empty=(icn,msg,btn='')=>`<div class="empty">${ic(icn)}<div>${msg}</div>${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`;

/* ===== Painel ===== */
function vPainel(){
  const now=new Date(),m=now.getMonth(),y=now.getFullYear();
  const valid=db.pedidos.filter(p=>p.status==='emitido'||p.status==='entregue');
  const mes=valid.filter(p=>{const d=new Date(p.data);return d.getMonth()===m&&d.getFullYear()===y});
  const fat=mes.reduce((s,p)=>s+p.total,0);
  const low=db.produtos.filter(p=>p.estoque<=0||(p.min>0&&p.estoque<=p.min));
  const ult=[...db.pedidos].sort((a,b)=>b.num-a.num).slice(0,6);
  $('#view').innerHTML=`
  <div class="top"><div><h1>Painel</h1><p>${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</p></div>
  <button class="btn pri" onclick="pedidoForm()">${ic('plus')}Nova nota</button></div>
  ${/^https?:$/.test(location.protocol)&&!ehApp()&&(INSTALAR||ehIOS())?`<div class="card aviso"><div class="avi">${ic('dl')}</div><div style="flex:1"><b>Instale o app no seu celular</b><div class="mut">Fica com o ícone da BC Vertex na tela inicial e funciona sem internet.</div></div><button class="btn sm pri" onclick="instalar()">Instalar</button></div>`:''}
  ${(db.pedidos.length||db.clientes.length)&&(!db.cfg.ultBackup||Date.now()-new Date(db.cfg.ultBackup)>30*864e5)?`<div class="card aviso"><div class="avi" style="background:var(--warnb);color:var(--warn)">${ic('dl')}</div><div style="flex:1"><b>${db.cfg.ultBackup?'Faz mais de 30 dias do último backup':'Você ainda não fez nenhum backup'}</b><div class="mut">Seus dados ficam só neste aparelho. Guarde uma cópia por segurança.</div></div><button class="btn sm" onclick="backup()">Fazer backup</button></div>`:''}
  <div class="kpis">
    <div class="card kpi hl"><span>Faturado no mês</span><b>${brl(fat)}</b></div>
    <div class="card kpi" style="cursor:pointer" onclick="fStatus='areceber';go('pedidos')"><span>A receber</span><b style="color:${aReceber().length?'var(--bad)':'inherit'}">${brl(aReceber().reduce((s,p)=>s+Math.max(0,p.total-recebido(p)),0))}</b></div>
    <div class="card kpi" style="cursor:pointer" onclick="go('pedidos')"><span>Aguardando assinatura</span><b>${valid.filter(p=>!p.assin).length}</b></div>
    ${db.produtos.length?`<div class="card kpi" style="cursor:pointer" onclick="soAlerta=true;go('estoque')"><span>Materiais em alerta</span><b style="color:${low.length?'var(--warn)':'inherit'}">${low.length}</b></div>`
      :`<div class="card kpi" style="cursor:pointer" onclick="go('clientes')"><span>Clientes</span><b>${db.clientes.length}</b></div>`}
  </div>
  ${(()=>{const h=ymd(new Date()),l=db.agenda.filter(x=>x.status==='agendado'&&x.data>=h).sort((x,y)=>(x.data+(x.hora||'99')).localeCompare(y.data+(y.hora||'99'))).slice(0,4);
    return `<div class="card" style="margin-bottom:14px"><div class="wdh" style="padding:14px 18px 0;margin:0"><b>Próximos compromissos</b><button class="btn sm ghost" onclick="go('agenda')">${ic('cal')}Ver agenda</button></div>
    <div style="padding:0 18px 14px">${l.length?l.map(x=>`<div class="ag ${x.tipo}" style="cursor:pointer" onclick="agRef=pYmd('${x.data}');agDia='${x.data}';go('agenda')"><div class="agh"><b>${x.data===h?'Hoje':pYmd(x.data).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} ${x.hora||''}</b><span class="tag ${AGT[x.tipo][1]}">${AGT[x.tipo][0]}</span></div><div class="cli-name">${esc(cliName(x.cliente))}</div>${x.end?`<div class="mut">📍 ${esc(agEnd(x))}</div>`:''}</div>`).join(''):'<div class="mut" style="padding-top:8px">Nada agendado. <a href="#" onclick="agForm();return false" style="color:var(--p)">Agendar agora</a></div>'}</div></div>`})()}
  <div class="grid2">
    <div class="card"><h3>Últimas notas</h3>
      ${ult.length?`<div class="tw"><table><thead><tr><th>Nº</th><th>Cliente</th><th class="hide-m">Data</th><th>Status</th><th class="r">Total</th></tr></thead><tbody>
      ${ult.map(p=>`<tr style="cursor:pointer" onclick="pedidoForm('${p.id}')"><td><b>#${pad(p.num)}</b></td><td>${esc(cliName(p.cliente))}</td><td class="hide-m mut">${dt(p.data)}</td><td>${tag(p.status)}</td><td class="r"><b>${brl(p.total)}</b></td></tr>`).join('')}
      </tbody></table></div>`:empty('file','Nenhuma nota emitida ainda.')}
    </div>
    <div class="card"><h3>Serviços mais cobrados</h3>
      <div class="list-mini">${(()=>{const t=db.servicos.map(s=>({s,u:usoServ(s.id)})).filter(x=>x.u.v>0).sort((a,b)=>b.u.v-a.u.v).slice(0,6);
        return t.length?t.map(x=>`<div><span>${esc(x.s.nome)} <span class="mut">${qf(x.u.n)}×</span></span><b>${brl(x.u.v)}</b></div>`).join(''):`<div class="mut">${db.servicos.length?'Nenhum serviço cobrado ainda.':'Cadastre seus serviços na aba Serviços.'}</div>`})()}</div>
      ${low.length?`<h3 style="padding-top:14px">Materiais em alerta</h3><div class="list-mini">${low.slice(0,5).map(p=>`<div><span>${esc(p.nome)}</span><span>${qf(p.estoque)} ${esc(p.un)} ${stockTag(p)}</span></div>`).join('')}</div>`:''}
    </div>
  </div>`;
}
const cliName=id=>(byId(db.clientes,id)||{}).nome||'— cliente removido —';

/* ===== Pedidos ===== */
function vPedidos(){
  const s=q.pedidos.toLowerCase();
  let list=[...db.pedidos].sort((a,b)=>b.num-a.num).filter(p=>(!fStatus||(fStatus==='areceber'?baixa(p.status)&&pagSt(p)&&pagSt(p)!=='pago':p.status===fStatus))&&(!s||String(p.num).includes(s)||cliName(p.cliente).toLowerCase().includes(s)));
  $('#view').innerHTML=`
  <div class="top"><div><h1>Notas</h1><p>${db.pedidos.length} nota(s) emitida(s)</p></div>
  <button class="btn pri" onclick="pedidoForm()">${ic('plus')}Nova nota</button></div>
  <div class="toolbar"><div class="search">${ic('search')}<input placeholder="Buscar por número ou cliente" value="${esc(q.pedidos)}" oninput="q.pedidos=this.value;vPedidosList()"></div>
  <select class="f" style="width:auto" onchange="fStatus=this.value;vPedidos()"><option value="">Todos os status</option><option value="areceber" ${fStatus==='areceber'?'selected':''}>💰 A receber</option>${Object.entries(STAT).map(([k,v])=>`<option value="${k}" ${fStatus===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
  <div class="card" id="plist"></div>`;
  vPedidosList(list);
}
function vPedidosList(list){
  if(!list){const s=q.pedidos.toLowerCase();list=[...db.pedidos].sort((a,b)=>b.num-a.num).filter(p=>(!fStatus||(fStatus==='areceber'?baixa(p.status)&&pagSt(p)&&pagSt(p)!=='pago':p.status===fStatus))&&(!s||String(p.num).includes(s)||cliName(p.cliente).toLowerCase().includes(s)))}
  $('#plist').innerHTML=list.length?notasTable(list,true)
  :empty('file',db.pedidos.length?'Nenhuma nota encontrada.':'Você ainda não emitiu notas.',db.pedidos.length?'':`<button class="btn pri" onclick="pedidoForm()">${ic('plus')}Emitir primeira nota</button>`);
}
function notasTable(list,showCli){
  const acts=p=>`${p.status!=='cancelado'&&p.status!=='orcamento'&&!p.assin?`<button class="btn sm" title="Coletar assinatura" onclick="assinar('${p.id}')">${ic('pen')}</button>`:''}${baixa(p.status)?`<button class="btn sm ghost" title="Pagamento e fotos" onclick="anexos('${p.id}')">${ic('clip')}</button>`:''}<button class="btn sm ghost" title="PDF / enviar" onclick="docModal('${p.id}')">${ic('send')}</button><button class="btn sm ghost" title="Refazer nota" onclick="refazer('${p.id}')">${ic('copy')}</button><button class="btn sm" title="Abrir" onclick="pedidoForm('${p.id}')">${ic('edit')}</button>`;
  return `<div class="tw hide-m"><table><thead><tr><th>Nº</th>${showCli?'<th>Cliente</th>':''}<th class="hide-m">Data</th><th>Status</th><th class="r">Total</th><th></th></tr></thead><tbody>
  ${list.map(p=>`<tr><td><b>#${pad(p.num)}</b></td>${showCli?`<td class="cli-name">${esc(cliName(p.cliente))}</td>`:''}<td class="hide-m mut">${dt(p.data)}</td><td>${tag(p.status)} ${pagTag(p)} ${sigTag(p)}${(p.fotos||[]).length?` <span class="tag t-nsig" title="Fotos">📷 ${p.fotos.length}</span>`:''}</td><td class="r"><b>${brl(p.total)}</b></td>
  <td><div class="acts">${acts(p)}</div></td></tr>`).join('')}</tbody></table></div><div class="ncards">${list.map(p=>`<div class="ncard"><div class="nct" onclick="pedidoForm('${p.id}')"><div><b>#${pad(p.num)}</b>${showCli?` · <span class="cli-name">${esc(cliName(p.cliente))}</span>`:''}<div class="mut">${dt(p.data)}</div></div><b class="ncv">${brl(p.total)}</b></div>
  <div class="nctags">${tag(p.status)} ${pagTag(p)} ${sigTag(p)}${(p.fotos||[]).length?` <span class="tag t-nsig">📷 ${p.fotos.length}</span>`:''}</div>
  <div class="acts" style="justify-content:flex-start">${acts(p)}</div></div>`).join('')}</div>`;
}

let ED=null; // pedido em edição
function novaNota(extra){return{id:null,num:db.seq.ped,data:new Date().toISOString(),cliente:'',itens:[],desc:0,frete:0,pag:'Pix',status:'emitido',obs:'',entrega:'',...extra}}
function refazer(id){
  const o=byId(db.pedidos,id);
  pedidoForm(null,novaNota({cliente:o.cliente,itens:structuredClone(o.itens),desc:o.desc,frete:o.frete,pag:o.pag,obs:o.obs,refazDe:o.num}));
  toast(`Copiado da nota #${pad(o.num)} — confira e emita.`);
}

function sigInit(){

  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);SIG.draw=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};

const agDoDia=k=>db.agenda.filter(a=>a.data===k).sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
const agEnd=a=>[a.end,a.apto&&('Apto/Bloco '+a.apto)].filter(Boolean).join(' – ');
const mapa=a=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.end||'')}`;
function agCard(a){
  const done=a.status!=='agendado';
  return `<div class="ag ${a.tipo}${done?' done':''}">
    <div class="agh"><b class="agt">${a.hora||'--:--'}</b><span class="tag ${AGT[a.tipo][1]}">${AGT[a.tipo][0]}</span>${a.status!=='agendado'?`<span class="tag ${AGS[a.status][1]}">${AGS[a.status][0]}</span>`:''}${a.nota?`<span class="tag t-sig" style="cursor:pointer" title="Pagamento e fotos" onclick="const n=db.pedidos.find(x=>x.num===${a.nota});n&&anexos(n.id)">Nota #${pad(a.nota)} · 📷💰</span>`:''}</div>
    <div class="cli-name" style="margin-top:4px">${esc(cliName(a.cliente))}</div>
    ${a.end||a.apto?`<div class="mut">📍 ${esc(agEnd(a))}</div>`:''}
    ${a.serv?`<div class="mut">🔧 ${esc((byId(db.servicos,a.serv)||{}).nome||'')}${a.valor?' · '+brl(a.valor):''}</div>`:''}
    ${a.obs?`<div class="mut">📝 ${esc(a.obs)}</div>`:''}
    <div class="acts" style="justify-content:flex-start;margin-top:8px">
      ${a.end?`<a class="btn sm ghost" href="${mapa(a)}" target="_blank" rel="noopener">${ic('pin')}Mapa</a>`:''}
      ${a.status==='agendado'?`<button class="btn sm ${a.cal?'ghost':''}" title="Aviso no celular" onclick="lembreteModal('${a.id}')">${ic('bell')}${a.cal?'✓':'Avisar'}</button>`:''}
      ${a.status==='agendado'?`<button class="btn sm" onclick="agConcluir('${a.id}')">${ic('check')}Concluir</button>`:''}
      ${!a.nota&&a.status!=='cancelado'?`<button class="btn sm pri" onclick="agNota('${a.id}')">${ic('file')}${a.tipo==='orcamento'?'Gerar orçamento':'Gerar nota'}</button>`:''}
      <button class="btn sm ghost" onclick="agForm('${a.id}')">${ic('edit')}</button>
    </div></div>`;
}
function vAgenda(){
  const hoje=ymd(new Date());let titulo,corpo;
  if(agView==='semana'){
    const ini=segunda(agRef),fim=addD(ini,6);
    titulo=`${ini.getDate()} ${ini.toLocaleDateString('pt-BR',{month:'short'})} – ${fim.getDate()} ${fim.toLocaleDateString('pt-BR',{month:'short',year:'numeric'})}`;
    corpo=`<div class="wk">${[0,1,2,3,4,5,6].map(i=>{const d=addD(ini,i),k=ymd(d),l=agDoDia(k);
      return `<div class="card wd${k===hoje?' today':''}"><div class="wdh"><div><b>${DSEM[d.getDay()]}</b> <span class="mut">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span>${k===hoje?' <span class="tag t-emi">Hoje</span>':''}</div><button class="btn sm ghost" title="Agendar neste dia" onclick="agForm(null,'${k}')">${ic('plus')}</button></div>
      ${l.length?l.map(agCard).join(''):'<div class="mut" style="padding:4px 2px 2px">Livre</div>'}</div>`}).join('')}</div>`;
  }else{
    const m=agRef.getMonth(),y=agRef.getFullYear(),ini=segunda(new Date(y,m,1));
    titulo=agRef.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    let cells='';for(let i=0;i<42;i++){const d=addD(ini,i),k=ymd(d),l=agDoDia(k);if(i===35&&d.getMonth()!==m)break;
      cells+=`<div class="mc${d.getMonth()!==m?' out':''}${k===hoje?' today':''}${k===agDia?' sel':''}" onclick="agDia='${k}';vAgenda()"><div class="mn">${d.getDate()}</div>
      ${l.slice(0,3).map(a=>`<div class="chip ${a.tipo}${a.status!=='agendado'?' done':''}"><span class="hide-m">${a.hora||''} </span>${esc(cliName(a.cliente).split(' ')[0])}</div>`).join('')}${l.length>3?`<div class="mut" style="font-size:11px">+${l.length-3}</div>`:''}</div>`}
    const sd=pYmd(agDia),sl=agDoDia(agDia);
    corpo=`<div class="card" style="overflow:hidden"><div class="mgrid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="mhd">${x}</div>`).join('')}${cells}</div></div>
    <div class="card wd" style="margin-top:14px"><div class="wdh"><b>${sd.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</b><button class="btn sm pri" onclick="agForm(null,'${agDia}')">${ic('plus')}Agendar</button></div>
    ${sl.length?sl.map(agCard).join(''):'<div class="mut">Nenhum compromisso neste dia.</div>'}</div>`;
  }
  const per=agView==='semana'?(()=>{const i=segunda(agRef);return db.agenda.filter(a=>a.data>=ymd(i)&&a.data<=ymd(addD(i,6)))})():db.agenda.filter(a=>{const d=pYmd(a.data);return d.getMonth()===agRef.getMonth()&&d.getFullYear()===agRef.getFullYear()});
  const ativos=per.filter(a=>a.status!=='cancelado');
  $('#view').innerHTML=`
  <div class="top"><div><h1>Agenda</h1><p>${ativos.filter(a=>a.tipo==='servico').length} serviço(s) e ${ativos.filter(a=>a.tipo==='orcamento').length} orçamento(s) ${agView==='semana'?'nesta semana':'neste mês'}</p></div>
  <button class="btn pri" onclick="agForm()">${ic('plus')}Agendar</button></div>
  <div class="toolbar" style="align-items:center">
    <div class="seg"><button class="${agView==='semana'?'on':''}" onclick="agView='semana';vAgenda()">Semana</button><button class="${agView==='mes'?'on':''}" onclick="agView='mes';vAgenda()">Mês</button></div>
    <button class="btn sm ghost" onclick="agMove(-1)">‹</button><b style="min-width:150px;text-align:center;${agView==='mes'?'text-transform:capitalize':''}">${titulo}</b><button class="btn sm ghost" onclick="agMove(1)">›</button>
    <button class="btn sm ghost" onclick="agRef=new Date();agDia=ymd(new Date());vAgenda()">Hoje</button>
    <button class="btn sm" style="margin-left:auto" onclick="cfgLembretes()">${ic('bell')}Lembretes</button>
  </div>${corpo}`;
}
function agMove(n){if(agView==='semana')agRef=addD(agRef,7*n);else agRef=new Date(agRef.getFullYear(),agRef.getMonth()+n,1);vAgenda()}
function agForm(id,dia){
  const a=id?byId(db.agenda,id):{tipo:'servico',data:dia||ymd(new Date()),hora:'',status:'agendado',cliente:''};
  openModal(`<div class="mh"><h2>${id?'Editar agendamento':'Novo agendamento'}</h2><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <form class="mb" id="af" onsubmit="event.preventDefault();agSalvar('${id||''}')"><div class="fg">
    <div class="s6"><div class="seg big"><label><input type="radio" name="tipo" value="servico" ${a.tipo==='servico'?'checked':''}><span>🔧 Serviço</span></label><label><input type="radio" name="tipo" value="orcamento" ${a.tipo==='orcamento'?'checked':''}><span>📋 Orçamento</span></label></div></div>
    <label class="s3">Data *<input class="f" type="date" name="data" required value="${a.data}"></label>
    <label class="s3">Horário<input class="f" type="time" name="hora" value="${a.hora||''}"></label>
    <label class="s6">Cliente *<select class="f" name="cliente" onchange="agCli(this.value)"><option value="">Selecione…</option><option value="__novo">+ Cliente novo (digitar nome)</option>${[...db.clientes].sort((x,y)=>x.nome.localeCompare(y.nome)).map(c=>`<option value="${c.id}" ${a.cliente===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <label class="s6" id="novoNome" style="display:none">Nome do cliente *<input class="f" name="nome" placeholder="Nome completo ou empresa"></label>
    <label class="s4">Endereço<input class="f" name="end" value="${esc(a.end||'')}" placeholder="Rua, número, bairro, cidade"></label>
    <label class="s2">Apto / Bloco<input class="f" name="apto" value="${esc(a.apto||'')}" placeholder="Ex.: 52 Bl. B"></label>
    <label class="s4">Serviço<select class="f" name="serv" onchange="agServ(this.value)"><option value="">—</option>${db.servicos.map(s=>`<option value="${s.id}" ${a.serv===s.id?'selected':''}>${esc(s.nome)} — ${brl(s.preco)}</option>`).join('')}</select></label>
    <label class="s2">Valor previsto (R$)<input class="f" name="valor" inputmode="decimal" value="${a.valor?a.valor.toFixed(2).replace('.',','):''}"></label>
    <label class="s6">Observações<textarea class="f" name="obs" rows="2" placeholder="Ex.: falar com o porteiro, levar escada">${esc(a.obs||'')}</textarea></label>
    ${id?`<label class="s3">Situação<select class="f" name="status">${Object.entries(AGS).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>`:''}
  </div></form>
  <div class="mf">${id?`<button class="btn red" style="margin-right:auto" onclick="agDel('${id}')">${ic('trash')}Excluir</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="$('#af').requestSubmit()">Salvar</button></div>`);
}
function agCli(v){$('#novoNome').style.display=v==='__novo'?'flex':'none';const c=byId(db.clientes,v),f=$('#af');
  if(c){const e=[c.rua&&(c.rua+(c.numero?', '+c.numero:'')),c.bairro,c.cidade&&(c.cidade+(c.uf?'/'+c.uf:''))].filter(Boolean).join(' – ');if(e)f.end.value=e;if(c.comp&&!f.apto.value)f.apto.value=c.comp}}
function agServ(v){const s=byId(db.servicos,v);if(s)$('#af').valor.value=s.preco.toFixed(2).replace('.',',')}
function agSalvar(id){
  const d=Object.fromEntries(new FormData($('#af')));
  if(d.cliente==='__novo'){const n=(d.nome||'').trim();if(!n)return toast('Digite o nome do cliente.');
    const c={id:'c'+Date.now(),cod:db.seq.cli++,tipo:'PF',nome:n,rua:d.end,comp:d.apto,uf:'SP',criado:new Date().toISOString()};db.clientes.push(c);d.cliente=c.id;toast('Cliente cadastrado.')}
  if(!d.cliente)return toast('Selecione o cliente.');
  delete d.nome;d.valor=num(d.valor);
  const old=id?{...byId(db.agenda,id)}:null,mudou=old&&(old.data!==d.data||old.hora!==d.hora||old.end!==d.end||old.apto!==d.apto);
  let aid=id;if(id){Object.assign(byId(db.agenda,id),d);if(mudou)byId(db.agenda,id).cal=false}else{aid='a'+Date.now();db.agenda.push({id:aid,status:'agendado',...d})}
  agRef=pYmd(d.data);agDia=d.data;save();if(page!=='agenda')go('agenda');else render();
  const ag=byId(db.agenda,aid);avisados.delete(aid);
  if(ag.status==='agendado'&&(!id||(mudou&&old.cal)))lembreteModal(aid,!id,!!id);else{closeModal();toast('Agendamento salvo.')}
}
function agConcluir(id){byId(db.agenda,id).status='concluido';save();render();toast('Marcado como concluído.')}
function agDel(id){if(!confirm('Excluir este agendamento?'))return;db.agenda=db.agenda.filter(a=>a.id!==id);save();closeModal();render()}
function agNota(id){
  const a=byId(db.agenda,id),s=byId(db.servicos,a.serv);
  const itens=s?[{prod:s.id,nome:s.nome,un:s.un,qtd:1,preco:a.valor||s.preco}]:[];
  pedidoForm(null,novaNota({cliente:a.cliente,itens,status:a.tipo==='orcamento'?'orcamento':'emitido',obs:[agEnd(a)&&('Local: '+agEnd(a)),a.obs].filter(Boolean).join('\n'),entrega:a.data,agenda:a.id}));
}

/* ===== Lembretes / aviso no celular ===== */
const AV1=[[0,'Sem aviso'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes'],[120,'2 horas antes'],[180,'3 horas antes']];
const AV2=[[0,'Sem aviso'],[720,'12 horas antes'],[1440,'1 dia antes'],[2880,'2 dias antes']];
const DURS=[[30,'30 min'],[60,'1 hora'],[90,'1h30'],[120,'2 horas'],[180,'3 horas'],[240,'4 horas'],[480,'Dia todo (8h)']];
const lbl=(arr,v)=>(arr.find(x=>x[0]==v)||[0,''])[1];
function avTxt(){const t=[db.cfg.av1&&lbl(AV1,db.cfg.av1),db.cfg.av2&&lbl(AV2,db.cfg.av2)].filter(Boolean);return t.length?t.join(' e '):'sem aviso'}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\;');
const p2=n=>String(n).padStart(2,'0');
const icsDT=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
const fold=l=>{if(l.length<=73)return l;const o=[];for(let i=0;i<l.length;i+=72)o.push(l.slice(i,i+72));return o.join('\r\n ')};
function agIni(a){const d=pYmd(a.data);const[h,m]=(a.hora||'08:00').split(':').map(Number);d.setHours(h,m,0,0);return d}
const agTitulo=a=>`${a.tipo==='orcamento'?'📋 Orçamento':'🔧 Serviço'} – ${cliName(a.cliente)}`;
function agDesc(a){const s=byId(db.servicos,a.serv),c=byId(db.clientes,a.cliente)||{};
  return [s&&('Serviço: '+s.nome),a.valor&&('Valor: '+brl(a.valor)),a.apto&&('Apto/Bloco: '+a.apto),c.tel&&('Tel: '+c.tel),a.obs,'— BC Vertex'].filter(Boolean).join('\n')}
function icsEvent(a){
  const ini=agIni(a),fim=new Date(ini.getTime()+(db.cfg.dur||60)*60000);
  const al=[db.cfg.av1,db.cfg.av2].filter(x=>x>0).map(x=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(agTitulo(a))}\r\nTRIGGER:-PT${x}M\r\nEND:VALARM`);
  return ['BEGIN:VEVENT','UID:'+a.id+'@bcvertex','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+icsDT(ini),'DTEND:'+icsDT(fim),
    'SUMMARY:'+icsEsc(agTitulo(a)),'LOCATION:'+icsEsc(agEnd(a)),'DESCRIPTION:'+icsEsc(agDesc(a)),...al,'END:VEVENT'].join('\r\n');
}
function gcal(a){const ini=agIni(a),fim=new Date(ini.getTime()+(db.cfg.dur||60)*60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(agTitulo(a))+'&dates='+icsDT(ini)+'/'+icsDT(fim)+'&ctz=America%2FSao_Paulo&location='+encodeURIComponent(agEnd(a))+'&details='+encodeURIComponent(agDesc(a))}
function agMarcaCal(id){const a=byId(db.agenda,id);if(a){a.cal=true;save();setTimeout(()=>{closeModal();render()},300)}}
function enviarCal(ids,nome){
  const l=ids.map(id=>byId(db.agenda,id)).filter(Boolean);if(!l.length)return toast('Nenhum compromisso para enviar.');
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BC Vertex//Servicos//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:BC Vertex',...l.map(icsEvent),'END:VCALENDAR'].join('\r\n').split('\r\n').map(fold).join('\r\n');
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(txt)}
  else{const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'})),k=document.createElement('a');k.href=u;k.download=(nome||'agenda')+'.ics';document.body.appendChild(k);k.click();k.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}
  l.forEach(a=>a.cal=true);save();closeModal();render();
  toast(l.length>1?`${l.length} compromissos enviados — abra o arquivo para adicionar à agenda.`:'Abra o arquivo para adicionar à agenda do celular.');
}
function lembreteModal(id,novo,mudou){
  const a=byId(db.agenda,id);
  openModal(`<div class="done"><div class="ok">${ic('bell')}</div><h2>${novo?'Agendado!':'Aviso no celular'}</h2>
    <p class="mut" style="margin:0">${esc(agTitulo(a))}<br>${pYmd(a.data).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}${a.hora?' às '+a.hora:''}</p>
    ${mudou?'<p class="tag t-low" style="margin:12px 0 0">Data, hora ou endereço mudou — envie de novo para atualizar o aviso</p>':''}
    <p style="margin:14px 0 0"><b>Quer ser avisado no celular?</b></p></div>
  <div class="bigbtns">
    <a class="btn pri" href="${gcal(a)}" target="_blank" rel="noopener" onclick="agMarcaCal('${id}')">${ic('cal')}Google Agenda<small>Android / qualquer celular</small></a>
    <button class="btn" onclick="enviarCal(['${id}'],'compromisso-${a.data}')">${ic('bell')}Calendário do celular<small>iPhone, Samsung (.ics)</small></button>
  </div>
  <p class="mut" style="text-align:center;margin:0 20px 10px">Alarme: <b>${avTxt()}</b> · <a href="#" onclick="cfgLembretes('${id}');return false" style="color:var(--p)">alterar</a></p>
  <div class="mf"><button class="btn ghost" onclick="closeModal()">Agora não</button></div>`);
}
function proximos(){const h=ymd(new Date());return db.agenda.filter(a=>a.status==='agendado'&&a.data>=h)}
function cfgLembretes(voltar){
  const n=proximos(),perm=window.Notification?Notification.permission:'na';
  openModal(`<div class="mh"><h2>Lembretes</h2><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <form class="mb" id="lf"><div class="fg">
    <div class="sec">Alarmes no celular</div>
    <label class="s3">1º aviso<select class="f" name="av1">${AV1.map(([v,t])=>`<option value="${v}" ${db.cfg.av1==v?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="s3">2º aviso<select class="f" name="av2">${AV2.map(([v,t])=>`<option value="${v}" ${db.cfg.av2==v?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="s3">Duração padrão<select class="f" name="dur">${DURS.map(([v,t])=>`<option value="${v}" ${db.cfg.dur==v?'selected':''}>${t}</option>`).join('')}</select></label>
    <div class="s6 mut">Os alarmes valem para os próximos envios (no Google Agenda vale o aviso padrão da sua agenda). Compromissos sem horário ficam marcados para as 8h.</div>
    <div class="sec">Enviar tudo de uma vez</div>
    <div class="s6"><button type="button" class="btn" onclick="cfgSalvar(true);enviarCal(proximos().map(a=>a.id),'agenda-bc-vertex')" ${n.length?'':'disabled'}>${ic('bell')}${n.length===1?'Enviar o próximo compromisso':`Enviar os ${n.length} próximos compromissos`} para o celular</button></div>
    <div class="sec">Com o app aberto</div>
    <div class="s6">${perm==='granted'?'<span class="tag t-ent">✓ Notificações ativadas neste aparelho</span>':perm==='na'?'<span class="mut">Este navegador não suporta notificações.</span>':`<button type="button" class="btn ghost" onclick="pedirNotif()">${ic('bell')}Ativar notificações do navegador</button>`}
      <div class="mut" style="margin-top:6px">Com o app aberto, ele também toca um alerta na tela no horário do 1º aviso.</div></div>
  </div></form>
  <div class="mf"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="cfgSalvar();${voltar?`lembreteModal('${voltar}')`:`closeModal();toast('Lembretes salvos.')`}">Salvar</button></div>`);
}
function cfgSalvar(){const f=$('#lf');if(!f)return;db.cfg.av1=+f.av1.value;db.cfg.av2=+f.av2.value;db.cfg.dur=+f.dur.value;save()}
function pedirNotif(){Notification.requestPermission().then(p=>{toast(p==='granted'?'Notificações ativadas.':'O navegador não permitiu as notificações.');cfgSalvar();cfgLembretes()})}
const avisados=new Set();
function checaAvisos(){
  const now=new Date(),lead=db.cfg.av1||30;
  for(const a of db.agenda){if(a.status!=='agendado'||!a.hora)continue;const min=Math.round((agIni(a)-now)/60000);
    if(min>=0&&min<=lead&&!avisados.has(a.id)){avisados.add(a.id);
      const txt=`${agTitulo(a)} às ${a.hora}${a.end?' · '+agEnd(a):''}`;
      if(window.Notification&&Notification.permission==='granted'){try{new Notification(min?`Compromisso em ${min} min`:'Compromisso agora',{body:txt,tag:a.id})}catch(e){}}
      alerta(txt,min,a.id)}}
}
function alerta(txt,min,id){const el=$('#alerta');
  el.innerHTML=`<div class="ai">${ic('bell')}</div><div style="flex:1;cursor:pointer" onclick="$('#alerta').classList.remove('show');agRef=new Date();agView='semana';go('agenda')"><b>${min?`Em ${min} min`:'Agora'}</b><div>${esc(txt)}</div></div><button class="x" style="color:#fff" onclick="$('#alerta').classList.remove('show')">${ic('x')}</button>`;
  el.classList.add('show');beep()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start();setTimeout(()=>o.frequency.value=660,200);setTimeout(()=>o.frequency.value=880,400);setTimeout(()=>{o.stop();c.close()},600)}catch(e){}}
setInterval(checaAvisos,30000);setTimeout(checaAvisos,1200);
setTimeout(()=>{const h=db.agenda.filter(a=>a.status==='agendado'&&a.data===ymd(new Date()));if(h.length)toast(`📅 Hoje você tem ${h.length} compromisso${h.length>1?'s':''}.`)},800);

/* ===== Clientes ===== */
function vClientes(){
  $('#view').innerHTML=`
  <div class="top"><div><h1>Clientes</h1><p>${db.clientes.length} cliente(s) cadastrados</p></div>

async function buscaCEP(v){
  const cep=String(v).replace(/\D/g,'');if(cep.length!==8)return;
  try{const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);const d=await r.json();if(d.erro)return toast('CEP não encontrado.');
    const f=$('#cf');if(!f.rua.value)f.rua.value=d.logradouro||'';if(!f.bairro.value)f.bairro.value=d.bairro||'';f.cidade.value=d.localidade||f.cidade.value;f.uf.value=d.uf||f.uf.value;f.cep.value=cep.replace(/(\d{5})(\d{3})/,'$1-$2');f.numero.focus();toast('Endereço preenchido pelo CEP.')
  }catch(e){/* sem internet: preenchimento manual */}
}

  const p=byId(db.produtos,id);const h=db.movs.filter(m=>m.prod===id).slice(-8).reverse();
  openModal(`<div class="mh"><h2>Estoque · ${esc(p.nome)}</h2><button class="x" onclick="closeModal()">${ic('x')}</button></div>

function salvarMov(id){
  const p=byId(db.produtos,id),d=Object.fromEntries(new FormData($('#mf')));let qt=num(d.qtd);
  if(d.tipo!=='ajuste'&&qt<=0)return toast('Informe a quantidade.');

function hex2hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
const hs=(h,s,l,a)=>`hsl(${h} ${Math.max(0,Math.min(100,s))}% ${Math.max(0,Math.min(100,l))}%${a!=null?' / '+a:''})`;

      '--bg':hs(H,14*n+6,7),'--card':hs(H,14*n+6,11),'--ink':hs(H,20*n,93),'--muted':hs(H,10*n+4,64),'--line':hs(H,12*n+6,20),
      '--soft':hs(H,12*n+6,13.5),'--hover':hs(H,14*n+6,15),'--soft2':hs(H,8*n+4,19),'--lbl':hs(H,12*n,80),
      '--ok':'#34d399','--okb':'#0e3a2b','--warn':'#fbbf24','--warnb':'#3b2a0a','--bad':'#f87171','--badb':'#45191b','--info':'#60a5fa','--infob':'#15284a',
      '--shadow':'0 1px 2px rgba(0,0,0,.3)','--toast':hs(H,20*n,22)})}
  else{Object.assign(v,{'--p':t.cor,'--p2':hs(H,S,Math.min(L+13,72)),'--p3':hs(H,S*.85+5,95),
      '--bg':hs(H,40*n+5,97),'--card':'#fff','--ink':hs(H,35*n+10,12),'--muted':hs(H,12*n+5,46),'--line':hs(H,35*n+8,91),
      '--soft':hs(H,40*n+10,98.5),'--hover':hs(H,50*n+10,98),'--soft2':hs(H,12*n+5,95),'--lbl':hs(H,20*n+8,30),
      '--ok':'#059669','--okb':'#d1fae5','--warn':'#b45309','--warnb':'#fef3c7','--bad':'#dc2626','--badb':'#fee2e2','--info':'#2563eb','--infob':'#dbeafe',
      '--shadow':`0 1px 2px ${hs(H,S,15,.06)},0 4px 16px ${hs(H,S,15,.06)}`,'--toast':hs(H,S*.5+10,13)})}
  v['--glow']=hs(H,S,L,.32);v['--ring']=hs(H,S,Math.max(L,55),.2);v['--c1']=hs(H,S,82);v['--c3']=hs(H,S,Math.max(L-12,8));
  const MENU={
    escuro:{'--side':hs(H,S*.55,dk?8:13),'--stx':hs(H,50*n,93),'--stx2':hs(H,40*n,80),'--smut':hs(H,30*n+5,64),'--shov':'rgba(255,255,255,.07)','--stxh':'#fff','--sideb':'0',
      '--navon':'linear-gradient(90deg,var(--p),var(--p2))','--navontx':'#fff','--navsh':'0 6px 18px var(--glow)'},
    cor:{'--side':`linear-gradient(170deg,${hs(H,S,Math.max(L-10,10))},${hs(H,S,Math.min(L+6,60))})`,'--stx':'#fff','--stx2':'rgba(255,255,255,.85)','--smut':'rgba(255,255,255,.72)','--shov':'rgba(255,255,255,.12)','--stxh':'#fff','--sideb':'0',
      '--navon':'rgba(255,255,255,.22)','--navontx':'#fff','--navsh':'inset 0 0 0 1px rgba(255,255,255,.25)'},
    claro:{'--side':'var(--card)','--stx':'var(--ink)','--stx2':'var(--muted)','--smut':'var(--muted)','--shov':'var(--hover)','--stxh':'var(--ink)','--sideb':'1px solid var(--line)',
      '--navon':'var(--p3)','--navontx':'var(--p)','--navsh':'none'}};
  Object.assign(v,MENU[t.menu]||MENU.escuro);
  Object.assign(v,{reto:{'--r':'4px','--rb':'4px','--rm':'6px','--rs':'3px'},suave:{'--r':'9px','--rb':'7px','--rm':'12px','--rs':'5px'},
    arred:{'--r':'14px','--rb':'10px','--rm':'16px','--rs':'8px'},redondo:{'--r':'22px','--rb':'16px','--rm':'26px','--rs':'12px'}}[t.cantos]||{});
  v['--font']=t.fonte;v['--zoom']={peq:'.92',normal:'1',grande:'1.1'}[t.tam]||'1';
  const R=document.documentElement;for(const k in v)R.style.setProperty(k,v[k]);R.classList.toggle('dk',dk);
  let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}m.content=dk?'#000':hs(H,S*.55,13);

function trimSig(src){const x=src.getContext('2d'),{width:w,height:h}=src,d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const a=d[(y*w+i)*4+3],r=d[(y*w+i)*4];if(a>20&&r<235){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;const pd=10;x0=Math.max(0,x0-pd);y0=Math.max(0,y0-pd);x1=Math.min(w-1,x1+pd);y1=Math.min(h-1,y1+pd);
  const cw=x1-x0+1,chh=y1-y0+1,k=Math.min(1,600/cw),o=document.createElement('canvas');o.width=Math.round(cw*k);o.height=Math.round(chh*k);
  o.getContext('2d').drawImage(src,x0,y0,cw,chh,0,0,o.width,o.height);return o.toDataURL('image/png')}

async function backup(){
  toast('Preparando backup…');const anx={};
  try{const ks=await IDB.keys();for(const k of ks){const b=await IDB.get(k);anx[k]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}}catch(e){}
  const b=new Blob([JSON.stringify({...db,_anexos:anx})],{type:'application/json'});const a=document.createElement('a');
  db.cfg.ultBackup=new Date().toISOString();save();a.href=URL.createObjectURL(b);a.download=`bcvertex-servicos-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Backup gerado.')
}
function restaurar(f){
  if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pedidos||!d.clientes)throw 0;
    if(!confirm('Substituir todos os dados atuais pelo backup?'))return;const anx=d._anexos||{};delete d._anexos;
    for(const k in anx){fetch(anx[k]).then(r=>r.blob()).then(b=>IDB.put(k,b)).catch(()=>{})}db=d;for(const k in blank)if(db[k]===undefined)db[k]=structuredClone(blank[k]);save();render();toast('Backup restaurado.')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)
}
